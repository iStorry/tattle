name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build Linux binaries
        run: make linux

      # The address-owner table changes slowly; fetch it at most once a week.
      - name: Week number, for the cache
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data
          key: ip2asn-${{ steps.week.outputs.week }}
      - name: Fetch the address-owner table
        run: test -f data/ip2asn.tsv.gz || make data

      - name: Build the package
        run: packaging/build-deb.sh 0.0.0~ci amd64
      # The runner is a real machine with systemd, so this installs the
      # package, runs the service, upgrades, removes and purges it for real.
      - name: Install, upgrade and remove the package
        run: sudo packaging/test-deb.sh dist/tattle_0.0.0~ci_amd64.deb
      # The installer script, given the package just built, so nothing is
      # downloaded: it must install it, and refuse to run without root.
      - name: Run the installer script
        run: |
          if bash install.sh; then echo "the installer ran without root" >&2; exit 1; fi
          sudo ip link show vmbr0 >/dev/null 2>&1 || { sudo ip link add vmbr0 type bridge && sudo ip link set vmbr0 up; }
          sudo TATTLE_DEB="dist/tattle_0.0.0~ci_amd64.deb" bash install.sh
          systemctl is-active tattle
          sudo apt-get purge --yes tattle
